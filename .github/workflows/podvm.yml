name: PodVM build, measure, and release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "**"

concurrency:
  group: podvm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  packages: read
  attestations: read

jobs:
  cpu:
    name: CPU PodVM
    uses: ./.github/workflows/podvm-variant.yml
    with:
      variant: cpu

  nvidia:
    name: NVIDIA PodVM
    uses: ./.github/workflows/podvm-variant.yml
    with:
      variant: nvidia

  assemble:
    name: Assemble and validate release
    needs: [cpu, nvidia]
    runs-on:
      group: arc-runners-kvm
    permissions:
      contents: read
    steps:
      - name: Install checkout dependencies
        run: |
          elevate=()
          if (( EUID != 0 )); then elevate=(sudo -n); fi
          "${elevate[@]}" apt-get update
          "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends ca-certificates git

      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install assembly dependencies
        run: bash .github/scripts/install-runner-dependencies.sh assemble

      - name: Download CPU package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: podvm-cpu-package
          path: build/packages/cpu

      - name: Download NVIDIA package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: podvm-nvidia-package
          path: build/packages/nvidia

      - name: Assemble and validate release assets
        run: |
          python3 podvm.py assemble
          python3 podvm.py validate --dist-dir dist
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload unified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: podvm-release-assets
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: assemble
    runs-on:
      group: arc-runners-kvm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Install checkout dependencies
        run: |
          elevate=()
          if (( EUID != 0 )); then elevate=(sudo -n); fi
          "${elevate[@]}" apt-get update
          "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends ca-certificates git

      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install release dependencies
        run: bash .github/scripts/install-runner-dependencies.sh publish

      - name: Download unified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: podvm-release-assets
          path: dist

      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.zst
            dist/measurements.json
            dist/SHA256SUMS

      - name: Verify published attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in dist/*.tar.zst dist/measurements.json dist/SHA256SUMS; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}"
          done

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              --generate-notes \
              --title "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
