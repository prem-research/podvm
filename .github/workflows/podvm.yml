name: PodVM build, measure, and release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "**"

concurrency:
  group: podvm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build and boot PodVM
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.2.0

      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils jq qemu-system-x86 qemu-utils zstd
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          sudo modprobe vhost_vsock || true

      - name: Run contract tests
        run: make test

      - name: Verify immutable inputs and upstream provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 podvm.py verify

      - name: Build PodVM
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 podvm.py build

      - name: Smoke-test direct boot
        run: python3 podvm.py smoke --timeout 180

      - name: Upload staged PodVM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: podvm-staging
          path: build/staging/
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  measure:
    name: Measure and package PodVM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore staged PodVM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: podvm-staging
          path: build/staging

      - name: Install measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq qemu-system-x86 qemu-utils zstd
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          sudo modprobe vhost_vsock || true

      - name: Build pinned measurement tools
        run: |
          mkdir -p .work/tools
          git init --quiet .work/tools/tdx-measure
          git -C .work/tools/tdx-measure remote add origin https://github.com/virtee/tdx-measure.git
          git -C .work/tools/tdx-measure fetch --depth=1 origin 6b3fb948a9d5db3e3f5b005c85937116fb96017d
          git -C .work/tools/tdx-measure checkout --detach FETCH_HEAD
          test "$(git -C .work/tools/tdx-measure rev-parse HEAD)" = 6b3fb948a9d5db3e3f5b005c85937116fb96017d
          cargo build --locked --release -p tdx-measure-cli --manifest-path .work/tools/tdx-measure/Cargo.toml
          install -D .work/tools/tdx-measure/target/release/tdx-measure .work/bin/tdx-measure

          git init --quiet .work/tools/sev-snp-measure
          git -C .work/tools/sev-snp-measure remote add origin https://github.com/virtee/sev-snp-measure.git
          git -C .work/tools/sev-snp-measure fetch --depth=1 origin 5b6a79e86641a7ca1a377ba1848d1dcdc2498494
          git -C .work/tools/sev-snp-measure checkout --detach FETCH_HEAD
          test "$(git -C .work/tools/sev-snp-measure rev-parse HEAD)" = 5b6a79e86641a7ca1a377ba1848d1dcdc2498494

      - name: Calculate deterministic TDX and SEV-SNP measurements
        env:
          TDX_MEASURE: ${{ github.workspace }}/.work/bin/tdx-measure
          SEV_SNP_MEASURE: ${{ github.workspace }}/.work/tools/sev-snp-measure/sev-snp-measure.py
          PYTHONPATH: ${{ github.workspace }}/.work/tools/sev-snp-measure
        run: python3 podvm.py measure

      - name: Select artifact version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            version=${RELEASE_TAG}
          elif [[ -n "${PR_NUMBER}" ]]; then
            version=pr-${PR_NUMBER}-${GITHUB_SHA:0:12}
          else
            version=manual-${GITHUB_SHA:0:12}
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create and validate release assets
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 podvm.py package \
            --release-version "${VERSION}" \
            --source-revision "${GITHUB_SHA}" \
            --source-repository "${GITHUB_REPOSITORY}"
          python3 podvm.py validate --dist-dir dist
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: podvm-release-assets
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: measure
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: podvm-release-assets
          path: dist

      - name: Verify checksums
        run: (cd dist && sha256sum --check SHA256SUMS)

      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.zst
            dist/measurements.json
            dist/SHA256SUMS

      - name: Verify published attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in dist/*.tar.zst dist/measurements.json dist/SHA256SUMS; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}"
          done

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              --generate-notes \
              --title "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
