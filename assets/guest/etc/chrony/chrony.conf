# Image-owned sources only: no DHCP sources, host PHC, or unauthenticated fallback.
pool 1.ntp.ubuntu.com iburst maxsources 1 nts prefer
pool 2.ntp.ubuntu.com iburst maxsources 1 nts prefer
pool 3.ntp.ubuntu.com iburst maxsources 1 nts prefer
pool 4.ntp.ubuntu.com iburst maxsources 1 nts prefer
pool ntp-bootstrap.ubuntu.com iburst maxsources 1 nts certset 1
ntstrustedcerts 1 /etc/chrony/nts-bootstrap-ubuntu.crt
nosystemcert
ntstrustedcerts 0 /etc/ssl/certs/ca-certificates.crt

user _chrony
driftfile /run/chrony/drift
ntsdumpdir /run/chrony
pidfile /run/chrony/chronyd.pid
bindcmdaddress /run/chrony/chronyd.sock
# Client only; control is available exclusively through the private Unix socket.
port 0
cmdport 0
# Only the first update may step. The supervisor uses -R after admission.
makestep 0.1 1
