profiles:
  2vcpu-8g:
    cpus: 2
    memory: "8G"
  h100-pcie-1-96g:
    cpus: 8
    memory: "96G"
    gpu: { family: H100, platform: pcie, count: 1, nvswitch_count: 0 }
  h200-pcie-1-96g:
    cpus: 8
    memory: "96G"
    gpu: { family: H200, platform: pcie, count: 1, nvswitch_count: 0 }
  h100-hgx-8-768g:
    cpus: 16
    memory: "768G"
    gpu: { family: H100, platform: hgx-hopper, count: 8, nvswitch_count: 4 }
  h100-pcie-nvlink-8-768g:
    cpus: 16
    memory: "768G"
    gpu: { family: H100, platform: pcie-nvlink, count: 8, nvswitch_count: 0 }
  h200-hgx-8-768g:
    cpus: 16
    memory: "768G"
    gpu: { family: H200, platform: hgx-hopper, count: 8, nvswitch_count: 4 }
  b200-hgx-8-768g:
    cpus: 16
    memory: "768G"
    gpu: { family: B200, platform: hgx-blackwell, count: 8, nvswitch_count: 0 }
    tdx_topology:
      launch:
        machine: "q35,kernel_irqchip=split"
        smp: "16,cores=1,threads=1"
        netdevs:
        - "hubport,id=network-0,hubid=0"
        devices:
        - "pcie-root-port,id=rp-pci-bridge-0,bus=pcie.0,chassis=16,slot=0,addr=2,multifunction=off,bus-reserve=0x1,pref64-reserve=1m,mem-reserve=1m,io-reserve=4k"
        - "pcie-pci-bridge,bus=rp-pci-bridge-0,id=pci-bridge-0"
        - "virtio-serial-pci,disable-modern=false,id=serial0"
        - "virtconsole,chardev=charconsole0,id=console0"
        - "virtio-blk-pci,disable-modern=false,drive=root,config-wce=off,share-rw=on"
        - "virtio-scsi-pci,id=scsi0,disable-modern=false"
        - "virtio-blk-pci,disable-modern=false,drive=initdata,config-wce=off"
        - "@bridges"
        - "@synthetic_devices"
        - "vhost-vsock-pci,disable-modern=false,guest-cid=3,bus=pcie.0"
        - "virtio-net-pci,netdev=network-0,bus=pcie.0,disable-modern=false,mq=on,vectors=34,romfile="
      numa:
      - "node,nodeid=0,memdev=numa-mem0,cpus=0-3"
      - "node,nodeid=1,memdev=numa-mem1,cpus=4-7"
      - "node,nodeid=2,memdev=numa-mem2,cpus=8-11"
      - "node,nodeid=3,memdev=numa-mem3,cpus=12-15"
      - "dist,src=0,dst=1,val=17"
      - "dist,src=0,dst=2,val=21"
      - "dist,src=0,dst=3,val=26"
      - "dist,src=1,dst=0,val=17"
      - "dist,src=1,dst=2,val=26"
      - "dist,src=1,dst=3,val=21"
      - "dist,src=2,dst=0,val=21"
      - "dist,src=2,dst=1,val=26"
      - "dist,src=2,dst=3,val=17"
      - "dist,src=3,dst=0,val=26"
      - "dist,src=3,dst=1,val=21"
      - "dist,src=3,dst=2,val=17"
      objects:
      - "memory-backend-ram,id=numa-mem0,size=196608M,reserve=off"
      - "memory-backend-ram,id=numa-mem1,size=196608M,reserve=off"
      - "memory-backend-ram,id=numa-mem2,size=196608M,reserve=off"
      - "memory-backend-ram,id=numa-mem3,size=196608M,reserve=off"
      bridges:
      - "pxb-pcie,id=pxb-numa0,bus=pcie.0,bus_nr=32,numa_node=0"
      - "pcie-root-port,id=rp-numa0-0,bus=pxb-numa0,chassis=10,slot=0,multifunction=off"
      - "pcie-root-port,id=rp-numa0-1,bus=pxb-numa0,chassis=10,slot=1,multifunction=off"
      - "pxb-pcie,id=pxb-numa1,bus=pcie.0,bus_nr=64,numa_node=1"
      - "pcie-root-port,id=rp-numa1-0,bus=pxb-numa1,chassis=11,slot=0,multifunction=off"
      - "pcie-root-port,id=rp-numa1-1,bus=pxb-numa1,chassis=11,slot=1,multifunction=off"
      - "pxb-pcie,id=pxb-numa2,bus=pcie.0,bus_nr=96,numa_node=2"
      - "pcie-root-port,id=rp-numa2-0,bus=pxb-numa2,chassis=12,slot=0,multifunction=off"
      - "pcie-root-port,id=rp-numa2-1,bus=pxb-numa2,chassis=12,slot=1,multifunction=off"
      - "pxb-pcie,id=pxb-numa3,bus=pcie.0,bus_nr=128,numa_node=3"
      - "pcie-root-port,id=rp-numa3-0,bus=pxb-numa3,chassis=13,slot=0,multifunction=off"
      - "pcie-root-port,id=rp-numa3-1,bus=pxb-numa3,chassis=13,slot=1,multifunction=off"
      # Kata's endpoint order; each synthetic device stands in on the same root port.
      endpoints:
      - "vfio-pci,host=0000:ed:00.0,bus=rp-numa3-0"
      - "vfio-pci,host=0000:17:00.0,bus=rp-numa0-0"
      - "vfio-pci,host=0000:3d:00.0,bus=rp-numa0-1"
      - "vfio-pci,host=0000:5f:00.0,bus=rp-numa1-0"
      - "vfio-pci,host=0000:70:00.0,bus=rp-numa1-1"
      - "vfio-pci,host=0000:97:00.0,bus=rp-numa2-0"
      - "vfio-pci,host=0000:ba:00.0,bus=rp-numa2-1"
      - "vfio-pci,host=0000:dc:00.0,bus=rp-numa3-1"
      synthetic_devices:
      - "pci-testdev,bus=rp-numa3-0,membar=256G"
      - "pci-testdev,bus=rp-numa0-0,membar=256G"
      - "pci-testdev,bus=rp-numa0-1,membar=256G"
      - "pci-testdev,bus=rp-numa1-0,membar=256G"
      - "pci-testdev,bus=rp-numa1-1,membar=256G"
      - "pci-testdev,bus=rp-numa2-0,membar=256G"
      - "pci-testdev,bus=rp-numa2-1,membar=256G"
      - "pci-testdev,bus=rp-numa3-1,membar=256G"
      qemu_globals:
      - "kvm-pit.lost_tick_policy=discard"
      fw_cfg: []
  b300-hgx-8-768g:
    cpus: 16
    memory: "768G"
    gpu: { family: B300, platform: hgx-blackwell, count: 8, nvswitch_count: 0 }
tdx:
  acpi_distribution: "ubuntu:26.04"
  qemu_source_version: "11.0.1"
  qemu:
    measurement_machine: "q35,kernel-irqchip=split,hpet=off,smm=off,pic=off"
    runtime_machine: "q35,kernel-irqchip=split,hpet=off,smm=off,pic=off,confidential-guest-support=tdx"
    cpu: "host,pmu=off"
    accel: "kvm"
    measurement_objects: []
    runtime_objects:
    - "tdx-guest,id=tdx"
    netdevs:
    - "user,id=network0"
    measurement_netdevs:
    - "hubport,id=network0,hubid=0"
    measurement_devices:
    - "virtio-serial-pci,id=serial0,disable-modern=false,max_ports=2"
    - "virtconsole,chardev=charconsole0"
    - "virtio-blk-pci,drive=root,disable-modern=false"
    - "virtio-scsi-pci,id=scsi0,disable-modern=false"
    - "virtio-net-pci,netdev=network0,disable-modern=false,romfile="
    - "vhost-vsock-pci,guest-cid=3,disable-modern=false"
    runtime_devices:
    - "virtio-serial-pci,id=serial0,disable-modern=false,max_ports=2"
    - "virtconsole,chardev=charconsole0"
    - "virtio-blk-pci,drive=root,disable-modern=false"
    - "virtio-scsi-pci,id=scsi0,disable-modern=false"
    - "virtio-net-pci,netdev=network0,disable-modern=false"
    - "vhost-vsock-pci,guest-cid=3,disable-modern=false"
sev:
  defaults:
    vcpu_types:
    - "EPYC-v4"
    - "EPYC-Milan-v2"
    - "EPYC-Genoa-v1"
    - "EPYC-Turin"
    vmm_type: "QEMU"
    guest_features: "0x1"
  qemu:
    machine: "q35,vmport=off,confidential-guest-support=sev0,memory-backend=ram1"
    memory_backend:
      id: "ram1"
      share: true
      prealloc: false
    guest:
      id: "sev0"
      cbitpos: 51
      reduced_phys_bits: 1
      kernel_hashes: true
    netdevs:
    - "user,id=network0"
    runtime_devices:
    - "virtio-serial-pci,id=serial0,disable-modern=false,max_ports=2"
    - "virtconsole,chardev=charconsole0"
    - "virtio-blk-pci,drive=root,disable-modern=false"
    - "virtio-scsi-pci,id=scsi0,disable-modern=false"
    - "virtio-net-pci,netdev=network0,disable-modern=false"
    - "vhost-vsock-pci,guest-cid=3,disable-modern=false"
