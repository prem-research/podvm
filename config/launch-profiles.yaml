profiles:
  2vcpu-8g:
    cpus: 2
    memory: "8G"
  h100-pcie-1-96g:
    cpus: 8
    memory: "96G"
    gpu: { family: H100, platform: pcie, count: 1, nvswitch_count: 0 }
  h200-pcie-1-96g:
    cpus: 8
    memory: "96G"
    gpu: { family: H200, platform: pcie, count: 1, nvswitch_count: 0 }
  h100-hgx-8-768g:
    cpus: 16
    memory: "768G"
    gpu: { family: H100, platform: hgx-hopper, count: 8, nvswitch_count: 4 }
  h100-pcie-nvlink-8-768g:
    cpus: 16
    memory: "768G"
    gpu: { family: H100, platform: pcie-nvlink, count: 8, nvswitch_count: 0 }
  h200-hgx-8-768g:
    cpus: 16
    memory: "768G"
    gpu: { family: H200, platform: hgx-hopper, count: 8, nvswitch_count: 4 }
  b200-hgx-8-768g:
    cpus: 16
    memory: "768G"
    gpu: { family: B200, platform: hgx-blackwell, count: 8, nvswitch_count: 0 }
    # kata-qemu-nvidia-gpu-tdx with enable_numa = false (guest NUMA randomizes RTMR0,
    # kata-containers#14083). Inherits tdx.kata_launch; only the GPU launch's differences are here.
    tdx_topology:
      launch:
        # qemu-system-x86_64-tdx-experimental (confidential-containers/qemu gpu-tdx-20260430).
        qemu_source_version: "11.0.0"
        # PCI0 64-bit window OVMF assigns for eight B200s (256G+64M+32M BARs); read from the guest DSDT.
        pci_hole64: { start: "0x380000000000", end: "0x3bd000018000" }
      numa: []
      objects: []
      bridges:
      - "pcie-root-port,id=rp0,bus=pcie.0,chassis=0,slot=0,multifunction=off"
      - "pcie-root-port,id=rp1,bus=pcie.0,chassis=0,slot=1,multifunction=off"
      - "pcie-root-port,id=rp2,bus=pcie.0,chassis=0,slot=2,multifunction=off"
      - "pcie-root-port,id=rp3,bus=pcie.0,chassis=0,slot=3,multifunction=off"
      - "pcie-root-port,id=rp4,bus=pcie.0,chassis=0,slot=4,multifunction=off"
      - "pcie-root-port,id=rp5,bus=pcie.0,chassis=0,slot=5,multifunction=off"
      - "pcie-root-port,id=rp6,bus=pcie.0,chassis=0,slot=6,multifunction=off"
      - "pcie-root-port,id=rp7,bus=pcie.0,chassis=0,slot=7,multifunction=off"
      # GPU-to-port order varies per boot; ACPI only describes the ports.
      endpoints:
      - "vfio-pci,host=0000:ba:00.0,bus=rp0"
      - "vfio-pci,host=0000:dc:00.0,bus=rp1"
      - "vfio-pci,host=0000:ed:00.0,bus=rp2"
      - "vfio-pci,host=0000:17:00.0,bus=rp3"
      - "vfio-pci,host=0000:3d:00.0,bus=rp4"
      - "vfio-pci,host=0000:5f:00.0,bus=rp5"
      - "vfio-pci,host=0000:70:00.0,bus=rp6"
      - "vfio-pci,host=0000:97:00.0,bus=rp7"
      # Approximates the B200 BARs (64M, 256G, 32M prefetchable) with the 256G one.
      synthetic_devices:
      - "pci-testdev,bus=rp0,membar=256G"
      - "pci-testdev,bus=rp1,membar=256G"
      - "pci-testdev,bus=rp2,membar=256G"
      - "pci-testdev,bus=rp3,membar=256G"
      - "pci-testdev,bus=rp4,membar=256G"
      - "pci-testdev,bus=rp5,membar=256G"
      - "pci-testdev,bus=rp6,membar=256G"
      - "pci-testdev,bus=rp7,membar=256G"
      qemu_globals: []
      fw_cfg: []
  b300-hgx-8-768g:
    cpus: 16
    memory: "768G"
    gpu: { family: B300, platform: hgx-blackwell, count: 8, nvswitch_count: 0 }
tdx:
  acpi_distribution: "ubuntu:26.04"
  qemu_source_version: "11.0.1"
  # Supported host CPUs by SMBIOS processor ID (CPUID.1 EAX,EDX as seen in a TD). It is
  # measured into RTMR0, so each CPU gets its own record. Read the ID from a real TD.
  processors:
    granite-rapids-a06d1: "d1060a00fffba90f"
  # The Kata 4.0.0 launch as observed on real TDs; GPU launches inherit it. {cpus}, {memory_mb}
  # and {net_vectors} (2 * cpus + 2) follow the profile; @bridges and @synthetic_devices place
  # a GPU topology's devices.
  kata_launch:
    machine: "q35,kernel_irqchip=split"
    smp: "{cpus},cores=1,threads=1"
    globals:
    - "kvm-pit.lost_tick_policy=discard"
    objects:
    - "memory-backend-ram,id=dimm1,size={memory_mb}M,reserve=off"
    numa:
    - "node,memdev=dimm1"
    netdevs:
    - "hubport,id=network-0,hubid=0"
    devices:
    - "pcie-root-port,id=rp-pci-bridge-0,bus=pcie.0,chassis=16,slot=0,addr=2,multifunction=off,bus-reserve=0x1,pref64-reserve=1m,mem-reserve=1m,io-reserve=4k"
    - "pcie-pci-bridge,bus=rp-pci-bridge-0,id=pci-bridge-0"
    - "virtio-serial-pci,disable-modern=false,id=serial0"
    - "virtconsole,chardev=charconsole0,id=console0"
    - "virtio-blk-pci,disable-modern=false,drive=root,config-wce=off,share-rw=on"
    - "virtio-scsi-pci,id=scsi0,disable-modern=false"
    - "virtio-blk-pci,disable-modern=false,drive=initdata,config-wce=off"
    - "@bridges"
    - "@synthetic_devices"
    - "vhost-vsock-pci,disable-modern=false,guest-cid=3,bus=pcie.0"
    - "virtio-net-pci,netdev=network-0,bus=pcie.0,disable-modern=false,mq=on,vectors={net_vectors},romfile="
  qemu:
    measurement_machine: "q35,kernel-irqchip=split,hpet=off,smm=off,pic=off"
    runtime_machine: "q35,kernel-irqchip=split,hpet=off,smm=off,pic=off,confidential-guest-support=tdx"
    cpu: "host,pmu=off"
    accel: "kvm"
    measurement_objects: []
    runtime_objects:
    - "tdx-guest,id=tdx"
    netdevs:
    - "user,id=network0"
    measurement_netdevs:
    - "hubport,id=network0,hubid=0"
    measurement_devices:
    - "virtio-serial-pci,id=serial0,disable-modern=false,max_ports=2"
    - "virtconsole,chardev=charconsole0"
    - "virtio-blk-pci,drive=root,disable-modern=false"
    - "virtio-scsi-pci,id=scsi0,disable-modern=false"
    - "virtio-net-pci,netdev=network0,disable-modern=false,romfile="
    - "vhost-vsock-pci,guest-cid=3,disable-modern=false"
    runtime_devices:
    - "virtio-serial-pci,id=serial0,disable-modern=false,max_ports=2"
    - "virtconsole,chardev=charconsole0"
    - "virtio-blk-pci,drive=root,disable-modern=false"
    - "virtio-scsi-pci,id=scsi0,disable-modern=false"
    - "virtio-net-pci,netdev=network0,disable-modern=false"
    - "vhost-vsock-pci,guest-cid=3,disable-modern=false"
sev:
  defaults:
    vcpu_types:
    - "EPYC-v4"
    - "EPYC-Milan-v2"
    - "EPYC-Genoa-v1"
    - "EPYC-Turin"
    vmm_type: "QEMU"
    guest_features: "0x1"
  qemu:
    machine: "q35,vmport=off,confidential-guest-support=sev0,memory-backend=ram1"
    memory_backend:
      id: "ram1"
      share: true
      prealloc: false
    guest:
      id: "sev0"
      cbitpos: 51
      reduced_phys_bits: 1
      kernel_hashes: true
    netdevs:
    - "user,id=network0"
    runtime_devices:
    - "virtio-serial-pci,id=serial0,disable-modern=false,max_ports=2"
    - "virtconsole,chardev=charconsole0"
    - "virtio-blk-pci,drive=root,disable-modern=false"
    - "virtio-scsi-pci,id=scsi0,disable-modern=false"
    - "virtio-net-pci,netdev=network0,disable-modern=false"
    - "vhost-vsock-pci,guest-cid=3,disable-modern=false"
